name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate render.yaml
        run: |
          if [ ! -f render.yaml ]; then
            echo "render.yaml not found"
            exit 1
          fi
          echo "render.yaml present"
      - name: Check Render secrets
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::warning::RENDER_SERVICE_ID is not configured. Add it in Settings -> Secrets and variables -> Actions."
          fi
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::RENDER_API_KEY is not configured. Add it in Settings -> Secrets and variables -> Actions."
          fi
      - name: Deploy to Render
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          clear_cache: false
          wait_deploy: true
          github_deployment: false
