name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate render.yaml
        run: |
          if [ ! -f render.yaml ]; then
            echo "render.yaml not found"
            exit 1
          fi
          echo "render.yaml present"
      - name: Validate Render secrets
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          missing=0
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::RENDER_SERVICE_ID is not configured."
            missing=1
          fi
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_API_KEY is not configured."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Render secrets present"
      - name: Deploy to Render
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json"
          )"
          echo "Render deployment triggered."
          echo "$response" | jq .
