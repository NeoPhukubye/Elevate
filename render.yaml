# Render.com deployment configuration for the Elevate backend
# Docs: https://render.com/docs/yaml-spec
#
# Database: dpg-damhpln40ujc73b08oeg-a (Elevate-db)
# Set DATABASE_URL in the Render dashboard to the connection string of
# dpg-damhpln40ujc73b08oeg-a (Settings -> Database -> Connection Info).

databases:
  - name: elevate-db
    databaseName: elevate
    plan: free
    ipAllowList: []

services:
  - type: web
    name: elevate-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        database: elevate-db
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.0-flash
      - key: AI_MAX_TOKENS
        value: 1500
      - key: AI_TEMPERATURE
        value: 0.4
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
    healthCheckPath: /health
    autoDeploy: true
